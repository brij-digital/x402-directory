<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BRIJ x402 Directory</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f2e8;
        color: #1b1b18;
        font: 18px/1.5 Georgia, serif;
      }
      main {
        width: min(680px, calc(100vw - 48px));
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(40px, 7vw, 72px);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }
      p {
        margin: 0 0 20px;
      }
      a {
        color: inherit;
        font-weight: 700;
      }
      code {
        background: #fff8e8;
        border: 1px solid #e8d8b8;
        border-radius: 10px;
        display: block;
        overflow-x: auto;
        padding: 14px 16px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BRIJ x402 Directory</h1>
      <p>Static JSON directory for AI assistants looking for x402 APIs.</p>
      <p>Start here:</p>
      <code>https://brij-digital.github.io/x402-directory/index.json</code>
      <p><a href="./index.json">Open index.json</a></p>
    </main>
  </body>
</html>
